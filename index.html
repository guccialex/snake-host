<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Snake Forever Adventure</title>

  <link data-trunk rel="copy-dir" href="assets/" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      color-scheme: dark;
      --checker-size: 20px;
      --overlay-bg: rgba(0, 0, 0, 0.5);
      --overlay-bg-hover: rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body { height: 100%; }

    body { margin: 0; background: #000; overflow: hidden; }

    #page-bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        135deg,
        #fff 0%,
        #fff 49%,
        #000 49%,
        #000 51%,
        #fff 51%,
        #fff 100%
      ) repeat;
      background-size: var(--checker-size) var(--checker-size);
      z-index: -1;
      pointer-events: none;
    }

    #game-root {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: grid;
      place-items: stretch;
      isolation: isolate;
    }

    #bevy-canvas,
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #fff;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #bevy-canvas:focus,
    #bevy-canvas:focus-visible {
      outline: none;
    }

    #overlay {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 2;
      pointer-events: auto;
    }

    .overlay-btn {
      padding: 6px 10px;
      font-size: 14px;
      line-height: 1;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: var(--overlay-bg);
      color: #fff;
      cursor: pointer;
      transition: background 120ms ease-in-out;
    }

    .overlay-btn:hover,
    .overlay-btn:focus-visible {
      background: var(--overlay-bg-hover);
    }

    #start-prompt {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      z-index: 3;
      cursor: pointer;
      user-select: none;
    }

    #start-prompt.hidden {
      display: none;
    }

    .start-label {
      place-self: center;
      display: inline-block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.4em;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>

<body>
  <div id="page-bg" aria-hidden="true"></div>

  <main id="game-root" role="application">
    <section id="start-prompt" role="button" tabindex="0">
      <span class="start-label">play</span>
    </section>

    <nav id="overlay" aria-label="Game controls">
      <button
        id="fullscreen-button"
        class="overlay-btn"
        type="button"
        title="Fullscreen (Esc to exit)"
      >
        Fullscreen
      </button>
    </nav>
  </main>

  <script type="module">
    const elements = {
      root: document.getElementById('game-root'),
      startPrompt: document.getElementById('start-prompt'),
      fullscreenButton: document.getElementById('fullscreen-button'),
    };

    if (!elements.root) {
      throw new Error('Missing #game-root element.');
    }

    let canvas = null;
    const state = { hasStarted: false, resizeAttached: false };

    const resizeObserver = typeof ResizeObserver === 'function'
      ? new ResizeObserver(() => resizeCanvas())
      : null;

    function resizeCanvas() {
      if (!canvas) {
        return;
      }

      const rect = elements.root.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);

      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;

      const internalWidth = Math.max(1, Math.floor(rect.width * dpr));
      const internalHeight = Math.max(1, Math.floor(rect.height * dpr));

      if (canvas.width !== internalWidth) {
        canvas.width = internalWidth;
      }

      if (canvas.height !== internalHeight) {
        canvas.height = internalHeight;
      }
    }

    function beginResizing() {
      if (state.resizeAttached) {
        return;
      }

      resizeObserver?.observe(elements.root);
      window.addEventListener('resize', resizeCanvas);
      state.resizeAttached = true;
    }

    async function toggleFullscreen() {
      const target = elements.root;
      const anyTarget = /** @type {any} */ (target);

      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (target.requestFullscreen) {
          await target.requestFullscreen();
        } else if (anyTarget.webkitRequestFullscreen) {
          anyTarget.webkitRequestFullscreen();
        }
      } catch (error) {
        console.warn('Fullscreen request failed:', error);
      }

      setTimeout(resizeCanvas, 0);
    }

    async function unlockAudioContext() {
      const AnyAudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AnyAudioContext) {
        return;
      }

      try {
        const context = (window.__bevyUnlockCtx ??= new AnyAudioContext());
        if (context.state === 'suspended') {
          await context.resume();
        }
      } catch (error) {
        console.warn('Audio context unlock failed:', error);
      }
    }

    async function startGame(init) {
      if (state.hasStarted) {
        return;
      }

      state.hasStarted = true;
      elements.startPrompt?.classList.add('hidden');

      await unlockAudioContext();

      try {
        await init();
      } catch (error) {
        state.hasStarted = false;
        elements.startPrompt?.classList.remove('hidden');
        console.error('Failed to initialize Bevy game:', error);
        return;
      }

      canvas = elements.root.querySelector('#bevy-canvas')
        || document.querySelector('#bevy-canvas')
        || document.querySelector('canvas')
        || document.createElement('canvas');

      if (canvas.id !== 'bevy-canvas') {
        canvas.id = 'bevy-canvas';
      }

      if (canvas.parentElement !== elements.root) {
        elements.root.append(canvas);
      }

      resizeCanvas();
      beginResizing();
      canvas?.focus?.();
    }

    function wireUI(init) {
      elements.fullscreenButton?.addEventListener('click', toggleFullscreen);

      const startController = new AbortController();
      const { signal } = startController;

      const attemptStart = (event) => {
        if (event?.type === 'pointerdown') {
          event.preventDefault();
        }

        startGame(init).then(() => {
          if (state.hasStarted) {
            startController.abort();
          }
        });
      };

      elements.startPrompt?.addEventListener('pointerdown', attemptStart, { signal });
      window.addEventListener(
        'keydown',
        (event) => {
          if (event.defaultPrevented || event.key === 'Tab') {
            return;
          }

          attemptStart(event);
        },
        { signal }
      );
    }

    async function bootstrap() {
      const module = await import('./target/bevy_game.js');
      const init = module.default ?? module;

      wireUI(init);
    }

    bootstrap().catch((error) => {
      console.error('Failed to bootstrap Bevy game:', error);
    });
  </script>
</body>
</html>
